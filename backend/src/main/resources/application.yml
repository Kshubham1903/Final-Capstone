server:
  port: 8080

spring:
  application:
    name: edupilot-backend
  
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/edupilot}
    
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000

# Endpoint to the Python AI service
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}