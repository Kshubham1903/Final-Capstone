server:
  port: 8080

spring:
  application:
    name: edupilot-backend
  
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/edupilot}
    
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000

# Endpoint to the Python AI service
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

# LLM Provider Configuration
llm:
  provider: ${LLM_PROVIDER:gemini} # gemini, openai, or mock
  openai:
    api-key: ${OPENAI_API_KEY:mock-key}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-flash-latest}
  temperature: ${LLM_TEMPERATURE:0.7}
  top-p: ${LLM_TOP_P:0.95}
  top-k: ${LLM_TOP_K:40}
  max-tokens: ${LLM_MAX_TOKENS:8192}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:15}